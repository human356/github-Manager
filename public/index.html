<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>مدیریت‌کننده گیت‌هاب</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%90%99%3C/text%3E%3C/svg%3E"/>
<style>
:root {
  --bg: #0d1117;
  --bg-soft: #161b22;
  --bg-card: #161b22;
  --border: #30363d;
  --border-soft: #21262d;
  --fg: #e6edf3;
  --fg-dim: #8b949e;
  --fg-faint: #6e7681;
  --accent: #238636;
  --accent-hover: #2ea043;
  --blue: #58a6ff;
  --blue-dim: #1f6feb;
  --red: #f85149;
  --red-dim: #da3633;
  --yellow: #d29922;
  --purple: #bc8cff;
  --teal: #39c5cf;
  --radius: 8px;
  --font: 'Vazirmatn', 'FreeSans', 'Segoe UI', Tahoma, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'Cascadia Mono', Consolas, Menlo, 'Courier New', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.7;
  direction: rtl;
}
#root { height: 100vh; display: flex; flex-direction: column; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
::selection { background: #1f6feb66; }

/* ---------- اسکرول‌بار ---------- */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #30363d; border-radius: 6px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #484f58; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- دکمه‌ها ---------- */
button {
  font-family: inherit; font-size: 13px;
  background: #21262d; color: var(--fg);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 14px; cursor: pointer;
  transition: background .15s, border-color .15s;
  display: inline-flex; align-items: center; gap: 6px;
  line-height: 1.8;
}
button:hover { background: #30363d; border-color: #8b949e; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: rgba(240,246,252,.1); color: #fff; font-weight: 600; }
button.primary:hover { background: var(--accent-hover); }
button.danger { background: transparent; border-color: var(--red-dim); color: var(--red); }
button.danger:hover { background: var(--red-dim); color: #fff; }
button.ghost { background: transparent; border-color: transparent; color: var(--fg-dim); }
button.ghost:hover { background: #21262d; color: var(--fg); }
button.small { padding: 2px 8px; font-size: 12px; }
button.icon-btn { padding: 4px 7px; }

/* ---------- فرم‌ها ---------- */
input[type=text], input[type=password], input[type=email], textarea, select {
  font-family: inherit; font-size: 13.5px;
  background: var(--bg); color: var(--fg);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 7px 12px; width: 100%;
  outline: none; transition: border-color .15s, box-shadow .15s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(56,139,253,.25);
}
textarea { resize: vertical; min-height: 90px; }
label.field { display: block; margin-bottom: 14px; }
label.field > span.lbl { display: block; margin-bottom: 6px; color: var(--fg-dim); font-size: 12.5px; }
label.chk { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 12px; }
label.chk input { width: auto; accent-color: var(--accent); }
.hint { color: var(--fg-faint); font-size: 12px; margin-top: 5px; line-height: 1.9; }
.code-inline { font-family: var(--mono); direction: ltr; unicode-bidi: embed; background: #21262d; padding: 1px 6px; border-radius: 4px; font-size: 12px; }

/* ---------- چیدمان‌های اصلی ---------- */
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 20px; background: var(--bg-soft);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.topbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.topbar .brand svg { color: var(--fg); }
.topbar .spacer { flex: 1; }
.userchip { display: flex; align-items: center; gap: 10px; }
.userchip img { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); }
.userchip .uname { font-size: 13px; font-weight: 600; }
.userchip .login { font-size: 11.5px; color: var(--fg-dim); direction: ltr; }

.container { flex: 1; overflow: auto; padding: 24px; }
.container.narrow { max-width: 1080px; margin: 0 auto; width: 100%; }

/* ---------- لاگین ---------- */
.login-wrap { max-width: 460px; margin: 6vh auto 0; }
.login-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }
.login-card h1 { font-size: 20px; margin: 0 0 6px; }
.login-card .sub { color: var(--fg-dim); margin-bottom: 22px; font-size: 13px; }
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tabs button {
  background: transparent; border: none; border-bottom: 2px solid transparent;
  border-radius: 0; color: var(--fg-dim); padding: 8px 14px; margin-bottom: -1px;
}
.tabs button.active { color: var(--fg); border-bottom-color: #f78166; font-weight: 600; }
.device-box {
  background: var(--bg); border: 1px dashed var(--border); border-radius: 6px;
  padding: 18px; text-align: center; margin-top: 14px;
}
.device-box .ucode { font-size: 26px; font-weight: 800; letter-spacing: 5px; direction: ltr; font-family: var(--mono); color: #f78166; margin: 8px 0; }
.oauth-note { background: #132a43; border: 1px solid #1f4468; border-radius: 6px; padding: 12px 14px; font-size: 12.5px; color: #a5c8ee; margin-bottom: 16px; line-height: 2; }
.warn-note { background: #241d14; border: 1px solid #5c4a22; border-radius: 6px; padding: 12px 14px; font-size: 12.5px; color: #d9b06c; margin-bottom: 16px; line-height: 2; }

/* ---------- نوار مخازن ---------- */
.list-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.list-head h2 { margin: 0; font-size: 17px; }
.list-head .count-pill { background: #21262d; border-radius: 20px; padding: 1px 12px; font-size: 12px; color: var(--fg-dim); }
.searchbox { flex: 1; min-width: 200px; max-width: 380px; }
.repo-grid { display: flex; flex-direction: column; gap: 10px; }
.repo-item {
  display: flex; align-items: center; gap: 14px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 18px; transition: border-color .15s;
}
.repo-item:hover { border-color: #484f58; }
.repo-item .rmeta { flex: 1; min-width: 0; }
.repo-item .rname { font-weight: 700; font-size: 14.5px; direction: ltr; text-align: right; unicode-bidi: embed; }
.repo-item .rdesc { color: var(--fg-dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.repo-item .rstats { display: flex; gap: 14px; color: var(--fg-dim); font-size: 12px; margin-top: 6px; flex-wrap: wrap; }
.repo-item .rstats span { display: inline-flex; align-items: center; gap: 4px; }
.badge { font-size: 11px; padding: 1px 9px; border-radius: 20px; border: 1px solid var(--border); color: var(--fg-dim); white-space: nowrap; }
.badge.private { color: #d29922; border-color: #6e5a1e; background: #241d0f; }
.badge.public { color: #3fb950; border-color: #238636; background: #0f2417; }
.lang-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

/* ---------- نمای مخزن ---------- */
.repo-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.repo-head .rtitle { font-size: 16px; font-weight: 700; direction: ltr; unicode-bidi: embed; }
.repo-head select { width: auto; min-width: 130px; direction: ltr; font-family: var(--mono); font-size: 12.5px; }
.repo-toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.repo-body { display: grid; grid-template-columns: 320px 1fr 330px; gap: 14px; align-items: start; }
@media (max-width: 1200px) { .repo-body { grid-template-columns: 280px 1fr; } .panel-changes { grid-column: 1 / -1; } }
@media (max-width: 860px) { .repo-body { grid-template-columns: 1fr; } }
.panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.panel-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; border-bottom: 1px solid var(--border-soft);
  font-weight: 600; font-size: 13px; background: #10151c;
}
.panel-head .spacer { flex: 1; }
.panel-body { padding: 0; max-height: 68vh; overflow: auto; }

/* ---------- درخت فایل ---------- */
.tree-row {
  display: flex; align-items: center; gap: 7px;
  padding: 4px 10px; cursor: pointer; font-size: 13px;
  border-left: 2px solid transparent;
  direction: ltr; text-align: left;
}
.tree-row:hover { background: #1c2129; }
.tree-row.selected { background: #1c2b3a; border-left-color: var(--blue); }
.tree-row .caret { width: 14px; flex: none; color: var(--fg-dim); font-size: 10px; text-align: center; }
.tree-row .ic { flex: none; display: flex; color: var(--fg-dim); }
.tree-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12.5px; }
.tree-row .sz { color: var(--fg-faint); font-size: 11px; flex: none; }
.tree-row .ops { flex: none; opacity: 0; display: flex; gap: 2px; }
.tree-row:hover .ops { opacity: 1; }
.tree-row.flag-new { color: #3fb950; }
.tree-row.flag-edited .name { color: #d29922; }
.tree-row.flag-moved { color: var(--purple); }
.tree-row.flag-copied { color: var(--teal); }
.tree-row .mini-badge { font-size: 10px; padding: 0 6px; border-radius: 10px; flex: none; border: 1px solid; }
.mb-new { color: #3fb950; border-color: #238636; }
.mb-edit { color: #d29922; border-color: #9e6a03; }
.mb-move { color: var(--purple); border-color: #6e40c9; }
.mb-copy { color: var(--teal); border-color: #1f7a80; }
.empty-tree { padding: 28px 16px; text-align: center; color: var(--fg-faint); font-size: 12.5px; }

/* ---------- نمایشگر/ویرایشگر فایل ---------- */
.viewer-body { padding: 14px; }
.viewer-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; font-size: 12px; color: var(--fg-dim); }
.viewer-meta .fpath { font-family: var(--mono); direction: ltr; unicode-bidi: embed; color: var(--fg); font-size: 12.5px; }
.code-area {
  width: 100%; min-height: 340px; direction: ltr; text-align: left;
  font-family: var(--mono); font-size: 13px; line-height: 1.65;
  background: var(--bg); white-space: pre; overflow: auto;
  tab-size: 4;
}
.bin-box { text-align: center; padding: 34px 12px; color: var(--fg-dim); }
.bin-box .big { font-size: 38px; margin-bottom: 10px; }
.viewer-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.ghost-info { background: #1c1042; border: 1px solid #4b2b9b; color: #cbb2ff; border-radius: 6px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 12px; line-height: 2; }

/* ---------- پنل تغییرات ---------- */
.chg-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 12px; border-bottom: 1px solid var(--border-soft); font-size: 12.5px;
}
.chg-item:last-child { border-bottom: none; }
.chg-item .cpath { font-family: var(--mono); direction: ltr; unicode-bidi: embed; font-size: 12px; word-break: break-all; flex: 1; }
.chg-item .cpath .arrow { color: var(--fg-faint); margin: 0 4px; }
.op-tag { font-size: 10.5px; padding: 0 7px; border-radius: 10px; border: 1px solid; flex: none; margin-top: 3px; white-space: nowrap; }
.op-create { color: #3fb950; border-color: #238636; }
.op-edit { color: #d29922; border-color: #9e6a03; }
.op-delete { color: var(--red); border-color: var(--red-dim); }
.op-move { color: var(--purple); border-color: #6e40c9; }
.op-copy { color: var(--teal); border-color: #1f7a80; }
.chg-item .undo { flex: none; }
.commit-box { padding: 14px; border-top: 1px solid var(--border); background: #10151c; }
.commit-box textarea { min-height: 70px; margin-bottom: 10px; }
.commit-btn { width: 100%; justify-content: center; font-size: 14.5px; padding: 8px; }
.result-box { text-align: center; padding: 8px 6px 4px; }
.result-box .sha { font-family: var(--mono); direction: ltr; unicode-bidi: embed; color: #3fb950; font-size: 13px; word-break: break-all; }
.result-box .counts { display: flex; justify-content: center; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
.result-box .counts span { font-size: 12px; background: #21262d; padding: 2px 10px; border-radius: 14px; }

/* ---------- مودال ---------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(1,4,9,.72);
  display: flex; align-items: center; justify-content: center; z-index: 100;
  padding: 20px; backdrop-filter: blur(2px);
}
.modal {
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px;
  width: 100%; max-width: 520px; max-height: 88vh; overflow: auto;
  box-shadow: 0 16px 48px rgba(0,0,0,.5);
}
.modal.wide { max-width: 720px; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--border-soft); font-weight: 700; font-size: 14.5px; }
.modal-head .spacer { flex: 1; }
.modal-body { padding: 20px; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-start; padding: 14px 20px; border-top: 1px solid var(--border-soft); }

/* ---------- توست ---------- */
.toasts { position: fixed; bottom: 18px; left: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: 380px; }
.toast {
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 16px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.45);
  display: flex; align-items: flex-start; gap: 8px;
  animation: slide-in .22s ease-out;
}
@keyframes slide-in { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
.toast.err { border-color: var(--red-dim); }
.toast.ok { border-color: var(--accent); }
.toast .tmsg { flex: 1; word-break: break-word; line-height: 1.9; }

/* ---------- متفرقه ---------- */
.spinner {
  width: 17px; height: 17px; border: 2px solid #30363d; border-top-color: var(--blue);
  border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; flex: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-page { flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--fg-dim); }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
.divider { height: 1px; background: var(--border-soft); margin: 16px 0; }
.kbd { font-family: var(--mono); background: #21262d; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 6px; font-size: 11.5px; direction: ltr; unicode-bidi: embed; }
.repo-menu { position: relative; }
.menu-pop {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 50;
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px;
  min-width: 170px; padding: 6px; box-shadow: 0 10px 28px rgba(0,0,0,.5);
}
.menu-pop button { width: 100%; justify-content: flex-start; background: transparent; border: none; border-radius: 6px; padding: 7px 12px; }
.menu-pop button:hover { background: #1c2129; }
.menu-pop button.danger { color: var(--red); }
.menu-pop button.danger:hover { background: var(--red-dim); color: #fff; }
.err-banner { background: #2d1416; border: 1px solid var(--red-dim); color: #ffb1ab; border-radius: 8px; padding: 12px 16px; font-size: 13px; margin-bottom: 14px; line-height: 2; }
.truncated-note { background: #241d14; border: 1px solid #6e5a1e; color: #d9b06c; border-radius: 6px; padding: 8px 12px; font-size: 12px; margin: 10px 14px; }
.form-row { display: flex; gap: 10px; }
.form-row > * { flex: 1; }
.mono-ltr { font-family: var(--mono); direction: ltr; unicode-bidi: embed; text-align: left; }
</style>
</head>

/* ------------------------------ توست ------------------------------ */
let toastId = 0;
function Toasts({ toasts, dismiss }) {
  return html`<div class="toasts">
    ${toasts.map((t) => html`<div key=${t.id} class=${'toast ' + t.type}>
      <span class="tmsg">${t.msg}</span>
      <button class="ghost small" onClick=${() => dismiss(t.id)}><${I.x}/></button>
    </div>`)}
  </div>`;
}
function useToasts() {
  const [toasts, setToasts] = useState([]);
  const dismiss = useCallback((id) => setToasts((ts) => ts.filter((t) => t.id !== id)), []);
  const toast = useCallback((msg, type = '') => {
    const id = ++toastId;
    setToasts((ts) => [...ts, { id, msg, type }]);
    setTimeout(() => dismiss(id), 6000);
  }, [dismiss]);
  return { toasts, toast, dismiss };
}

/* ------------------------------ مودال عمومی ------------------------------ */
function Modal({ title, onClose, children, footer, wide }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  return html`<div class="modal-overlay" onMouseDown=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div class=${'modal' + (wide ? ' wide' : '')}>
      <div class="modal-head">
        <span>${title}</span>
        <span class="spacer"></span>
        <button class="ghost icon-btn" onClick=${onClose}><${I.x}/></button>
      </div>
      <div class="modal-body">${children}</div>
      ${footer && html`<div class="modal-foot">${footer}</div>`}
    </div>
  </div>`;
}

/* ------------------------------ صفحه ورود ------------------------------ */
function Login({ onLogin, toast }) {
  const [mode, setMode] = useState('token');
  const [token, setToken] = useState('');
  const [busy, setBusy] = useState(false);
  const [clientId, setClientId] = useState('');
  const [device, setDevice] = useState(null);
  const [polling, setPolling] = useState(false);
  const [remain, setRemain] = useState(0);
  const pollRef = useRef(null);
  const remainRef = useRef(null);

  useEffect(() => () => { clearInterval(pollRef.current); clearInterval(remainRef.current); }, []);

  async function submitToken(e) {
    e.preventDefault();
    if (!token.trim()) return;
    setBusy(true);
    try {
      const d = await api('/api/auth/token', { method: 'POST', body: { token: token.trim() } });
      toast(`خوش آمدید ${d.user.login}!`, 'ok');
      onLogin(d.user);
    } catch (err) { toast(err.message, 'err'); }
    setBusy(false);
  }

  async function startDevice(e) {
    e.preventDefault();
    if (!clientId.trim()) return;
    setBusy(true); setDevice(null);
    try {
      const d = await api('/api/auth/device/start', { method: 'POST', body: { client_id: clientId.trim() } });
      setDevice(d);
      setRemain(d.expires_in || 900);
      setPolling(true);
      let interval = (d.interval || 5) * 1000;
      const tick = async () => {
        try {
          const r = await api('/api/auth/device/poll', { method: 'POST', body: { client_id: clientId.trim(), device_code: d.device_code } });
          if (r.ok) {
            clearInterval(pollRef.current); clearInterval(remainRef.current); setPolling(false);
            toast(`خوش آمدید ${r.user.login}!`, 'ok');
            onLogin(r.user);
          } else if (r.slow) {
            interval += 5000;
            clearInterval(pollRef.current);
            pollRef.current = setInterval(tick, interval);
          }
        } catch (err) {
          clearInterval(pollRef.current); clearInterval(remainRef.current); setPolling(false);
          toast(err.message, 'err');
        }
      };
      pollRef.current = setInterval(tick, interval);
      remainRef.current = setInterval(() => setRemain((s) => Math.max(0, s - 1)), 1000);
    } catch (err) { toast(err.message, 'err'); }
    setBusy(false);
  }

  return html`<div class="login-wrap">
    <div class="login-card">
      <h1>ورود با حساب گیت‌هاب</h1>
      <div class="sub">برای دسترسی به همه‌ی مخازن (از جمله خصوصی) وارد شوید. توکن فقط در دیتابیس محلی همین برنامه ذخیره می‌شود.</div>

      <div class="tabs">
        <button class=${mode === 'token' ? 'active' : ''} onClick=${() => setMode('token')}>توکن شخصی (PAT)</button>
        <button class=${mode === 'device' ? 'active' : ''} onClick=${() => setMode('device')}>Device Flow</button>
      </div>

      ${mode === 'token' && html`<form onSubmit=${submitToken}>
        <div class="oauth-note">
          ساخت توکن: در گیت‌هاب به <span class="kbd">Settings → Developer settings → Personal access tokens</span> بروید.
          برای دسترسی کامل به مخازن خصوصی، توکن <b>Classic</b> با دسترسی <span class="kbd">repo</span> (و در صورت نیاز <span class="kbd">delete_repo</span>) بسازید، یا در توکن Fine-grained دسترسی <b>Contents: Read and write</b> به مخازن موردنظر بدهید.
        </div>
        <label class="field">
          <span class="lbl">توکن دسترسی شخصی</span>
          <input type="password" dir="ltr" value=${token} onChange=${(e) => setToken(e.target.value)} placeholder="ghp_… یا github_pat_…" autocomplete="off" />
        </label>
        <button class="primary" type="submit" disabled=${busy || !token.trim()} style=${{ width: '100%', justifyContent: 'center' }}>
          ${busy ? html`<span class="spinner"></span>` : html`<${I.gh} size=${15}/>`} ورود و دریافت اطلاعات کاربر
        </button>
      </form>`}

      ${mode === 'device' && html`<form onSubmit=${startDevice}>
        <div class="oauth-note">
          ابتدا در <span class="kbd">github.com/settings/developers</span> یک OAuth App بسازید و گزینه‌ی <b>Enable Device Flow</b> را فعال کنید؛ سپس <b>Client ID</b> آن را اینجا وارد کنید.
          دسترسی درخواستی: <span class="kbd">repo</span> (کامل، شامل مخازن خصوصی).
        </div>
        <label class="field">
          <span class="lbl">Client ID اپلیکیشن OAuth</span>
          <input type="text" dir="ltr" value=${clientId} onChange=${(e) => setClientId(e.target.value)} placeholder="Ov23li…  یا Iv1.xxxx…" autocomplete="off" />
        </label>
        <button class="primary" type="submit" disabled=${busy || !clientId.trim()} style=${{ width: '100%', justifyContent: 'center' }}>
          ${busy ? html`<span class="spinner"></span>` : html`<${I.gh} size=${15}/>`} شروع ورود با Device Flow
        </button>

        ${device && html`<div class="device-box">
          <div>این کد را در صفحه‌ی فعال‌سازی وارد کنید:</div>
          <div class="ucode">${device.user_code}</div>
          <a href=${device.verification_uri} target="_blank" rel="noreferrer">${device.verification_uri}</a>
          <div class="hint" style=${{ marginTop: 10 }}>
            ${polling
              ? html`<${F}>در انتظار تأیید شما… <span class="spinner"></span> (${Math.floor(remain / 60)}:${String(remain % 60).padStart(2, '0')})</F>`
              : 'اتمام انتظار.'}
          </div>
        </div>`}
      </form>`}
    </div>
  </div>`;
}

/* ------------------------------ لیست مخازن ------------------------------ */
function RepoMenu({ repo, onEdit, onDelete, onBranch }) {
  const [open, setOpen] = useState(false);
  useEffect(() => {
    if (!open) return;
    const close = () => setOpen(false);
    window.addEventListener('click', close);
    return () => window.removeEventListener('click', close);
  }, [open]);
  return html`<div class="repo-menu">
    <button class="icon-btn" onClick=${(e) => { e.stopPropagation(); setOpen(!open); }}><${I.dots}/></button>
    ${open && html`<div class="menu-pop" onClick=${(e) => e.stopPropagation()}>
      <button onClick=${() => onEdit(repo)}><${I.pencil}/> ویرایش مخزن</button>
      <button onClick=${() => onBranch(repo)}><${I.branch}/> ساخت شاخه جدید</button>
      <button class="danger" onClick=${() => onDelete(repo)}><${I.trash}/> حذف مخزن…</button>
    </div>`}
  </div>`;
}

  const [editRepo, setEditRepo] = useState(null);

  const [branchRepo, setBranchRepo] = useState(null);

    ${filtered && filtered.length > 0 && html`<div class="repo-grid">
      ${filtered.map((r) => html`<div class="repo-item" key=${r.full_name}>
        <${I.gh} size=${22}/>
        <div class="rmeta">
          <div class="rname">
            <a href=${r.html_url} target="_blank" rel="noreferrer" onClick=${(e) => e.stopPropagation()}>${r.full_name}</a>
            <span class=${'badge ' + (r.private ? 'private' : 'public')}>${r.private ? html`<${I.lock}/> خصوصی` : 'عمومی'}</span>
            ${r.fork && html`<span class="badge">Fork</span>`}
          </div>
          ${r.description && html`<div class="rdesc">${r.description}</div>`}
          <div class="rstats">
            ${r.language && html`<span><i class="lang-dot" style=${{ background: LANG_COLORS[r.language] || '#8b949e' }}></i>${r.language}</span>`}
            <span><${I.star}/> ${r.stars}</span>
            <span><${I.fork}/> ${r.forks}</span>
            <span><${I.branch}/> ${r.default_branch}</span>
            <span>به‌روزرسانی ${fmtWhen(r.updated_at)}</span>
          </div>
        </div>
        <button class="primary" onClick=${() => openRepo(r)}>مدیریت فایل‌ها</button>
        <${RepoMenu} repo=${r} onEdit=${setEditRepo} onDelete=${setDelRepo} onBranch=${setBranchRepo}/>
      </div>`)}

    ${showNew && html`<${NewRepoModal} onClose=${() => setShowNew(false)} onDone=${() => { setShowNew(false); load(); }} toast=${toast}/>`}

    ${delRepo && html`<${DeleteRepoModal} repo=${delRepo} onClose=${() => setDelRepo(null)} onDone=${() => { setDelRepo(null); load(); }} toast=${toast}/>`}

}

function buildTree(entries) {
  const root = { name: '', path: '', isDir: true, children: new Map(), folderOpen: true };
  for (const e of entries) {
    const parts = e.path.split('/');
    let node = root;
    for (let i = 0; i < parts.length; i++) {
      const last = i === parts.length - 1;
      const p = parts.slice(0, i + 1).join('/');
      if (last) {
        if (!node.children.has(p)) node.children.set(p, { name: parts[i], path: p, isDir: false, entry: e });
        else node.children.get(p).entry = e;
      } else {
        if (!node.children.has(p)) node.children.set(p, { name: parts[i], path: p, isDir: true, children: new Map() });
        node = node.children.get(p);
      }
    }
  }
  const sortRec = (n) => {
    if (!n.children) return; /* نود فایل children ندارد */
    const kids = [...n.children.values()];
    kids.sort((a, b) => (a.isDir !== b.isDir) ? (a.isDir ? -1 : 1) : a.name.localeCompare(b.name, undefined, { numeric: true }));
    n.sorted = kids;
    kids.forEach(sortRec);
  };
  sortRec(root);
  return root;
}

function TreeRow({ node, depth, flags, selected, onSelect, onOps, expanded, setExpanded }) {
  const pad = { paddingInlineStart: 8 + depth * 14 + 'px' };
  if (node.isDir) {
    const isOpen = !!expanded[node.path];
    const flag = flags.get(node.path);
    return html`<${F}>
      <div class=${'tree-row' + (flag ? ' flag-' + flag : '')} style=${pad} onClick=${() => setExpanded((s) => ({ ...s, [node.path]: !isOpen }))}>
        <span class="caret">${isOpen ? '▾' : '▸'}</span>
        <span class="ic">${isOpen ? html`<${I.folderOpen}/>` : html`<${I.folder}/>`}</span>
        <span class="name">${node.name}</span>
        ${flag && html`<span class=${'mini-badge mb-' + flag}>${flag === 'new' ? 'جدید' : flag === 'edited' ? 'تغییر' : flag === 'moved' ? 'انتقال' : flag === 'copied' ? 'کپی' : ''}</span>`}
        <span class="ops">
          <button class="ghost icon-btn small" title="پوشه جدید" onClick=${(e) => { e.stopPropagation(); onOps('newFolder', node.path + '/'); }}><${I.plus}/></button>
          <button class="ghost icon-btn small" title="فایل جدید" onClick=${(e) => { e.stopPropagation(); onOps('newFile', node.path + '/'); }}><${I.file}/></button>
          <button class="ghost icon-btn small" title="انتقال پوشه" onClick=${(e) => { e.stopPropagation(); onOps('move', node.path); }}><${I.moveIc}/></button>
          <button class="ghost icon-btn small" title="کپی پوشه" onClick=${(e) => { e.stopPropagation(); onOps('copy', node.path); }}><${I.copyIc}/></button>
          <button class="ghost icon-btn small danger" title="حذف پوشه" onClick=${(e) => { e.stopPropagation(); onOps('delete', node.path, 'folder'); }}><${I.trash}/></button>
        </span>
      </div>
      ${isOpen && node.sorted.map((c) => html`<${TreeRow} key=${c.path} node=${c} depth=${depth + 1} flags=${flags} selected=${selected} onSelect=${onSelect} onOps=${onOps} expanded=${expanded} setExpanded=${setExpanded}/>`)}
    </${F}>`;
  }
  const flag = flags.get(node.path);
  return html`<div class=${'tree-row' + (selected === node.path ? ' selected' : '') + (flag ? ' flag-' + flag : '')}
    style=${pad} onClick=${() => onSelect(node.path)}>
    <span class="caret"></span>
    <span class="ic"><${I.file}/></span>
    <span class="name">${node.name}</span>
    ${flag && html`<span class=${'mini-badge mb-' + flag}>${flag === 'new' ? 'جدید' : flag === 'edited' ? 'تغییر' : flag === 'moved' ? 'انتقال' : flag === 'copied' ? 'کپی' : 'حذف‌شده'}</span>`}
    <span class="sz">${fmtSize(node.entry.size)}</span>
    <span class="ops">
      <button class="ghost icon-btn small" title="ویرایش" onClick=${(e) => { e.stopPropagation(); onSelect(node.path); }}><${I.pencil}/></button>
      <button class="ghost icon-btn small" title="انتقال" onClick=${(e) => { e.stopPropagation(); onOps('move', node.path); }}><${I.moveIc}/></button>
      <button class="ghost icon-btn small" title="کپی" onClick=${(e) => { e.stopPropagation(); onOps('copy', node.path); }}><${I.copyIc}/></button>
      <button class="ghost icon-btn small danger" title="حذف" onClick=${(e) => { e.stopPropagation(); onOps('delete', node.path, 'file'); }}><${I.trash}/></button>
    </span>
  </div>`;
}

function FileViewer({ repoFull, branch, selEntry, selectedPath, stagedContent, onStage, toast, reloadFlags, onCancelCreate }) {
  const [file, setFile] = useState(null);
  const [error, setError] = useState('');
  const [text, setText] = useState('');
  const [dirty, setDirty] = useState(false);
  const [busy, setBusy] = useState(false);
  const [isBin, setIsBin] = useState(false);
  const [binB64, setBinB64] = useState('');
  const [binName, setBinName] = useState('');
  const [committing, setCommitting] = useState(false);
  const fileRef = useRef(null);

  const path = selectedPath || (selEntry ? selEntry.path : null);

  useEffect(() => {
    setError(''); setFile(null); setDirty(false); setIsBin(false); setBinB64(''); setText('');
    if (!path || stagedContent !== undefined) return;
    let alive = true;
    (async () => {
      setBusy(true);
      try {
        const qp = new URLSearchParams({ path, ref: branch });
        if (selEntry.sha) qp.set('sha', selEntry.sha);
        const d = await api(`/api/repos/${repoFull}/content?` + qp.toString());
        if (!alive) return;
        setFile(d);
        if (d.encoding === 'base64') {
          const u8 = Uint8Array.from(atob(d.content), (c) => c.charCodeAt(0));
          if (looksBinary(u8)) { setIsBin(true); setBinB64(d.content); setBinName(d.name); }
          else setText(b64ToUtf8(d.content));
        } else setText(d.content);
      } catch (err) { if (alive) setError(err.message); }
      if (alive) setBusy(false);
    })();
    return () => { alive = false; };
  }, [path, branch, repoFull, selEntry]);

  if (!path) return html`<div class="empty-tree" style=${{ padding: 60 }}>یک فایل را از درخت انتخاب کنید.</div>`;

  if (stagedContent !== undefined) {
    /* فایل جدید (هنوز کامیت نشده) یا فایل ویرایش‌شده محلی */
    const isNewFile = stagedContent.__new;
    return html`<${StagedEditor}
      path=${path} isNew=${isNewFile} initial=${isNewFile ? '' : stagedContent}
      onCancel=${() => (onCancelCreate ? onCancelCreate() : reloadFlags())}
      onStage=${onStage}/>`;
  }

  if (busy) return html`<div class="loading-page"><span class="spinner"></span> در حال دریافت ${path}…</div>`;
  if (error) return html`<div class="viewer-body"><div class="err-banner">${error}</div></div>`;

  const doStageEdit = async () => {
    setCommitting(true);
    try {
      await onStage({ op: 'edit', kind: 'file', path, content: utf8ToB64(text) });
      setDirty(false);
    } finally { setCommitting(false); }
  };

  return html`<div class="viewer-body">
    <div class="viewer-meta">
      <span class="fpath">${path}</span>
      <span>·</span><span>${fmtSize(file && file.size)}</span>
      ${dirty && html`<span class="mini-badge mb-edit">ویرایش محلی</span>`}
    </div>

    ${isBin
      ? html`<${F}>
          <div class="bin-box">
            <div class="big">🖼</div>
            <div>${binName} — فایل باینری است و در این نمایشگر قابل ویرایش نیست.</div>
            ${file && html`<div class="hint">${fmtSize(file.size)}</div>`}
          </div>
          <div class="viewer-actions">
            <button onClick=${() => {
              const a = document.createElement('a');
              a.href = 'data:application/octet-stream;base64,' + binB64;
              a.download = binName || path.split('/').pop();
              a.click();
            }}>دانلود فایل</button>
            <button onClick=${() => { setBinName(''); fileRef.current && fileRef.current.click(); }}><${I.upload}/> جایگزینی با فایل جدید…</button>
            <input ref=${fileRef} type="file" style=${{ display: 'none' }} onChange=${(e) => {
              const f = e.target.files[0]; if (!f) return;
              if (f.size > 20 * 1024 * 1024) { toast('فایل بزرگ‌تر از ۲۰ مگابایت نیست.', 'err'); return; }
              const rd = new FileReader();
              rd.onload = () => onStage({ op: 'edit', kind: 'file', path, content: bufToB64(rd.result), is_binary: true });
              rd.readAsArrayBuffer(f);
            }}/>
          </div>
        </${F}>`
      : html`<${F}>
          <textarea class="code-area" dir="ltr" spellCheck=${false} value=${text}
            onChange=${(e) => { setText(e.target.value); setDirty(true); }}
            onKeyDown=${(e) => {
              if (e.key === 'Tab' && !e.shiftKey) {
                e.preventDefault();
                const ta = e.target, s = ta.selectionStart, en = ta.selectionEnd;
                ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(en);
                ta.selectionStart = ta.selectionEnd = s + 2;
                setText(ta.value); setDirty(true);
              }
            }}></textarea>
          <div class="viewer-actions">
            <button class="primary" disabled=${!dirty || committing} onClick=${doStageEdit}>
              ${committing ? html`<span class="spinner"></span>` : html`<${I.check}/>`} ثبت در صف تغییرات
            </button>
            ${dirty && html`<button onClick=${() => { setText(b64ToUtf8(file.content)); setDirty(false); }}>واگردانی</button>`}
            <button class="danger" onClick=${() => onStage({ op: 'delete', kind: 'file', path })}><${I.trash}/> حذف این فایل</button>
          </div>
        </${F}>`}
  </div>`;
}

/* ویرایشگر فایل جدید یا نسخه‌ی محلی از پیش stage‌شده */
function StagedEditor({ path, isNew, initial, onStage, onCancel }) {
  const [text, setText] = useState(initial || '');
  const [binB64, setBinB64] = useState(null);
  const [binSize, setBinSize] = useState(0);
  const fileRef = useRef(null);
  useEffect(() => { setText(initial || ''); setBinB64(null); }, [path, initial]);
  return html`<div class="viewer-body">
    <div class="ghost-info">
      ${isNew
        ? html`<${F}>فایل جدید <b class="mono-ltr">${path}</b> — هنوز روی گیت‌هاب ثبت نشده؛ پس از نوشتن، در صف تغییرات ثبتش کنید و سپس با دکمه‌ی «ثبت نهایی» کامیت کنید.</F>`
        : html`<${F}>نسخه‌ی ویرایش‌شده‌ی محلی <b class="mono-ltr">${path}</b> — این متن هنوز کامیت نشده است.</F>`}
    </div>
    ${binB64
      ? html`<div class="bin-box">
          <div class="big">📄</div>
          <div>فایل باینری انتخاب شد — ${fmtSize(binSize)}</div>
          <div class="viewer-actions" style=${{ justifyContent: 'center' }}>
            <button onClick=${() => fileRef.current && fileRef.current.click()}>انتخاب فایل دیگر</button>
          </div>
        </div>`
      : html`<textarea class="code-area" dir="ltr" spellCheck=${false} value=${text}
          onChange=${(e) => setText(e.target.value)}></textarea>`}
    <input ref=${fileRef} type="file" style=${{ display: 'none' }} onChange=${(e) => {
      const f = e.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => { setBinB64(bufToB64(rd.result)); setBinSize(f.size); };
      rd.readAsArrayBuffer(f);
    }}/>
    <div class="viewer-actions">
      <button class="primary" disabled=${!binB64 && !text.trim()} onClick=${() => onStage({
        op: 'create', kind: 'file', path, content: binB64 || utf8ToB64(text), is_binary: !!binB64,
      })}>
        <${I.check}/> ثبت در صف تغییرات
      </button>
      ${isNew && html`<button onClick=${onCancel}>انصراف از ایجاد فایل</button>`}
      ${!isNew && html`<button onClick=${onCancel}>بازگشت به نسخه‌ی گیت‌هاب</button>`}
      ${!isNew && !binB64 && html`<button onClick=${() => fileRef.current && fileRef.current.click()}><${I.upload}/> جایگزینی با فایل باینری…</button>`}
      ${isNew && !binB64 && html`<button onClick=${() => fileRef.current && fileRef.current.click()}><${I.upload}/> به‌جای متن، فایل باینری انتخاب کن…</button>`}
    </div>
  </div>`;
}

/* ------------------------------ پنل تغییرات + کامیت ------------------------------ */

function ChangesPanel({ repoFull, changes, refreshTree, clearAll, toast, branch }) {
  const [msg, setMsg] = useState('');
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);
  const [confirmClear, setConfirmClear] = useState(false);
  const [showCommitModal, setShowCommitModal] = useState(false);

  async function undo(id) {
    try {
      await api(`/api/staging/${repoFull}/${id}`, { method: 'DELETE' });
      refreshTree();
    } catch (err) { toast(err.message, 'err'); }
  }
  async function clearChanges() {
    try {
      await api(`/api/staging/${repoFull}`, { method: 'DELETE' });
      setConfirmClear(false); setResult(null);
      refreshTree();
    } catch (err) { toast(err.message, 'err'); }
  }

  const counts = useMemo(() => {
    const c = { create: 0, edit: 0, delete: 0, move: 0, copy: 0 };
    for (const ch of changes) c[ch.op]++;
    return c;
  }, [changes]);

  async function doCommit() {
    setBusy(true); setResult(null);
    try {
      const d = await api(`/api/commit/${repoFull}`, { method: 'POST', body: { message: msg.trim(), branch } });
      setResult(d);
      setMsg('');
      toast('تغییرات با موفقیت روی گیت‌هاب ثبت شد ✔', 'ok');
      refreshTree();
      setShowCommitModal(false);
    } catch (err) {
      toast(err.message, 'err');
      setShowCommitModal(false);
    }
    setBusy(false);
  }

  return html`<div class="panel panel-changes">
    <div class="panel-head">
      تغییرات در انتظار ثبت
      ${changes.length > 0 && html`<span class="count-pill">${changes.length}</span>`}
      <span class="spacer"></span>
      ${changes.length > 0 && html`<button class="ghost small" onClick=${() => setConfirmClear(true)} title="حذف همه از صف">خالی‌کردن صف</button>`}
    </div>
    <div class="panel-body" style=${{ maxHeight: '34vh' }}>
      ${changes.length === 0
        ? html`<div class="empty-tree">هنوز تغییری ثبت نشده است.<br/>فایل یا پوشه‌ای بسازید، ویرایش کنید یا جابه‌جا کنید.</div>`
        : changes.map((c) => html`<div class="chg-item" key=${c.id}>
            <span class=${'op-tag ' + OP_CLS[c.op]}>${OP_LABELS[c.op]} ${c.kind === 'folder' ? 'پوشه' : 'فایل'}</span>
            <span class="cpath">${c.path}${c.dst ? html`<span class="arrow">←</span>${c.dst}` : ''}</span>
            ${c.is_binary && html`<span class="mini-badge mb-edit">باینری</span>`}
            <button class="ghost small undo" title="حذف از صف" onClick=${() => undo(c.id)}><${I.x}/></button>
          </div>`)}
    </div>
    ${result && html`<div class="result-box">
      <div class="hint">آخرین کامیت موفق:</div>
      <a class="sha" href=${result.html_url} target="_blank" rel="noreferrer">${result.sha.slice(0, 10)}</a>
      <div class="counts">
        ${result.counts.added ? html`<span style=${{ color: '#3fb950' }}>+${result.counts.added} جدید</span>` : null}
        ${result.counts.modified ? html`<span style=${{ color: '#d29922' }}>~${result.counts.modified} ویرایش</span>` : null}
        ${result.counts.removed ? html`<span style=${{ color: '#f85149' }}>−${result.counts.removed} حذف</span>` : null}
        ${result.counts.renamed ? html`<span style=${{ color: '#bc8cff' }}>↔${result.counts.renamed} جابه‌جایی</span>` : null}
      </div>
    </div>`}
    <div class="commit-box">
      <textarea placeholder="پیام کامیت (الزام)…" value=${msg} onChange=${(e) => setMsg(e.target.value)}></textarea>
      <button class="primary commit-btn" disabled=${busy || changes.length === 0 || !msg.trim()} onClick=${() => setShowCommitModal(true)}>
        ${busy ? html`<span class="spinner"></span>` : html`<${I.upload} size=${15}/>`} ثبت نهایی روی گیت‌هاب
      </button>
      <div class="hint" style=${{ marginTop: 8, textAlign: 'center' }}>
        ${counts.create || 0} ایجاد · ${counts.edit || 0} ویرایش · ${counts.delete || 0} حذف · ${counts.move || 0} انتقال · ${counts.copy || 0} کپی
      </div>
    </div>

    ${confirmClear && html`<${Modal} title="خالی‌کردن صف تغییرات" onClose=${() => setConfirmClear(false)} footer=${html`<${F}>
      <button class="danger" onClick=${clearChanges}>بله، همه را حذف کن</button>
      <button onClick=${() => setConfirmClear(false)}>انصراف</button>
    </F>`}>
      <p style=${{ marginTop: 0 }}>همه‌ی ${changes.length} تغییر ثبت‌نشده از صف حذف می‌شود. هیچ چیزی روی گیت‌هاب نمی‌رود و فقط تغییرات محلی دور ریخته می‌شود.</p>
    </${Modal}>`}

    ${showCommitModal && html`<${Modal} title="تأیید ثبت نهایی" onClose=${() => setShowCommitModal(false)} footer=${html`<${F}>
      <button class="primary" disabled=${busy} onClick=${doCommit}>${busy ? html`<span class="spinner"></span>` : html`<${I.upload}/>`} بله، کامیت کن</button>
      <button onClick=${() => setShowCommitModal(false)}>انصراف</button>
    </F>`}>
      <p style=${{ marginTop: 0, lineHeight: 2 }}>
        ${changes.length} تغییر روی شاخه‌ی <b class="mono-ltr">${branch}</b> در <b class="mono-ltr">${repoFull}</b> کامیت می‌شود.
        هویت کامیت «GitHub Manager» و شما به‌عنوان مشارکت‌کننده (Co-author) ثبت می‌شوند.
      </p>
      <div class="hint">پیام: ${msg.trim() || '—'}</div>
    </${Modal}>`}
  </div>`;
}
;
/* ------------------------------ نمای مخزن (فایل‌ها) ------------------------------ */

function RepoBrowser({ repo, onBack, toast }) {
  const [treeData, setTreeData] = useState(null);
  const [error, setError] = useState('');
  const [branch, setBranch] = useState(repo.default_branch);
  const [branches, setBranches] = useState([repo.default_branch]);
  const [selected, setSelected] = useState(null);
  const [expanded, setExpanded] = useState({});
  const [changes, setChanges] = useState([]);
  const [newFileAt, setNewFileAt] = useState(null);   /* مسیر پوشه برای فایل جدید */
  const [creatingFile, setCreatingFile] = useState(null); /* مسیر کامل فایل در حال ایجاد (هنوز stage نشده) */
  const [newFolderAt, setNewFolderAt] = useState(null);
  const [moveTarget, setMoveTarget] = useState(null);  /* {path, kind} */
  const [copyTarget, setCopyTarget] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [uploadFolder, setUploadFolder] = useState(null);
  const repoFull = repo.full_name;

  const loadTree = useCallback(async () => {
    setError('');
    try {
      const d = await api(`/api/repos/${repoFull}/tree?ref=${encodeURIComponent(branch)}`);
      setTreeData(d);
      const ch = await api(`/api/staging/${repoFull}`);
      setChanges(ch.changes);
    } catch (err) { setError(err.message); setTreeData(null); }
  }, [repoFull, branch]);

  useEffect(() => { loadTree(); }, [loadTree]);
  useEffect(() => {
    api(`/api/repos/${repoFull}/branches`)
      .then((d) => setBranches(d.branches.map((b) => b.name)))
      .catch(() => {});
  }, [repoFull]);

  /* نقشه‌ی پرچم‌ها از روی صف تغییرات — برای نمایش وضعیت در درخت */
  const flags = useMemo(() => {
    const m = new Map();
    for (const c of changes) {
      if (c.op === 'delete') m.set(c.path, 'deleted');
      else if (c.op === 'create') m.set(c.path, c.kind === 'folder' ? 'new' : 'new');
      else if (c.op === 'edit') m.set(c.path, 'edited');
      else if (c.op === 'move') { m.set(c.path, 'moved'); m.set(c.dst, 'moved'); }
      else if (c.op === 'copy') m.set(c.dst, 'copied');
    }
    return m;
  }, [changes]);

  /* محتوای stage‌شده برای فایل انتخاب‌شده (یا فایل در حال ایجاد) */
  const stagedForSelected = useMemo(() => {
    const path = selected;
    if (!path) return undefined;
    if (creatingFile === path) return { __new: true };
    const last = [...changes].reverse().find((c) => c.path === path && c.op !== 'delete' && c.op !== 'move');
    if (!last) return undefined;
    if (last.op === 'create') return { __new: true };
    if (last.op === 'edit') return last.is_binary ? undefined : b64ToUtf8(last.content);
    return undefined;
  }, [changes, selected, creatingFile]);

  const selEntry = useMemo(() => {
    if (!treeData || !selected) return null;
    return treeData.entries.find((e) => e.path === selected) || null;
  }, [treeData, selected]);

  const rootTree = useMemo(() => (treeData ? buildTree(treeData.entries) : null), [treeData]);

  async function onStage(body) {
    try {
      const d = await api(`/api/staging/${repoFull}`, { method: 'POST', body });
      setChanges(d.changes);
      toast(`در صف ثبت شد: ${OP_LABELS[body.op]} ${body.kind === 'folder' ? 'پوشه' : 'فایل'} — ${body.path}`, 'ok');
      if (body.op === 'create') { setSelected(body.path); setCreatingFile(null); }
      return d;
    } catch (err) { toast(err.message, 'err'); throw err; }
  }

  function onOps(action, path, kind) {
    if (action === 'newFile') setNewFileAt(path);
    else if (action === 'newFolder') setNewFolderAt(path);
    else if (action === 'move') setMoveTarget({ path, kind });
    else if (action === 'copy') setCopyTarget({ path, kind });
    else if (action === 'delete') setDeleteTarget({ path, kind });
  }

  return html`<div class="container">
    <div class="repo-head">
      <button class="ghost" onClick=${onBack}>→ بازگشت</button>
      <span class="rtitle">
        <a href=${repo.html_url} target="_blank" rel="noreferrer">${repoFull}</a>
        <span class=${'badge ' + (repo.private ? 'private' : 'public')}>${repo.private ? html`<${I.lock}/> خصوصی` : 'عمومی'}</span>
      </span>
      <span class="spacer"></span>
      <select value=${branch} onChange=${(e) => { setBranch(e.target.value); setSelected(null); }}>
        ${branches.map((b) => html`<option key=${b} value=${b}>${b}</option>`)}
      </select>
      <button onClick=${loadTree} title="به‌روزرسانی"><${I.refresh}/> به‌روزرسانی</button>
    </div>

    <div class="repo-toolbar">
      <button class="primary" onClick=${() => setNewFileAt('')}><${I.plus}/> فایل جدید</button>
      <button onClick=${() => setNewFolderAt('')}><${I.plus}/> پوشه جدید</button>
      <button onClick=${() => setUploadFolder('')}><${I.upload}/> بارگذاری فایل…</button>
      <span class="spacer"></span>
      ${treeData && html`<span class="hint" style=${{ alignSelf: 'center' }}>${treeData.entries.length} فایل · شاخه‌ی ${branch}</span>`}
    </div>

    ${error && html`<div class="err-banner">${error}</div>`}
    ${treeData && treeData.truncated && html`<div class="truncated-note">⚠️ این مخزن خیلی بزرگ است و نمایش درخت ناقص شده است (فقط ۱۰۰هزار آیتم اول گیت‌هاب).</div>`}

    <div class="repo-body">
      <div class="panel">
        <div class="panel-head"><${I.folder}/> فایل‌ها <span class="spacer"></span>
          <button class="ghost small" onClick=${() => setExpanded({})}>بستن همه</button>
        </div>
        <div class="panel-body">
          ${!rootTree ? html`<div class="loading-page" style=${{ padding: 30 }}><span class="spinner"></span></div>`
            : rootTree.sorted.length === 0 ? html`<div class="empty-tree">این مخزن خالی است. یک فایل بسازید.</div>`
            : rootTree.sorted.map((c) => html`<${TreeRow} key=${c.path} node=${c} depth=${0} flags=${flags}
                selected=${selected} onSelect=${setSelected} onOps=${onOps} expanded=${expanded} setExpanded=${setExpanded}/>`)}
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><${I.file}/> ${selected || 'مشاهده/ویرایش فایل'}</div>
        <${FileViewer} repoFull=${repoFull} branch=${branch} selEntry=${selEntry} selectedPath=${selected} stagedContent=${stagedForSelected}
          onStage=${onStage} toast=${toast} reloadFlags=${loadTree} onCancelCreate=${() => { setCreatingFile(null); setSelected(null); }}/>
      </div>

      <${ChangesPanel} repoFull=${repoFull} changes=${changes} refreshTree=${loadTree} toast=${toast} branch=${branch}/>
    </div>

    ${newFileAt !== null && html`<${PathModal} title="فایل جدید" placeholder="docs/README.md" label="مسیر فایل جدید" folderPrefix=${newFileAt}
      note=${'مسیر نسبت به ریشه‌ی مخزن؛ پوشه‌های میانی خودکار ساخته می‌شوند.'}
      onClose=${() => setNewFileAt(null)} onDone=${(p) => { setNewFileAt(null); setCreatingFile(p); setSelected(p); }}/>`}

    ${newFolderAt !== null && html`<${NewFolderModal} folderPrefix=${newFolderAt} onClose=${() => setNewFolderAt(null)}
      onStage=${onStage} toast=${toast}/>`}

    ${uploadFolder !== null && html`<${UploadModal} onClose=${() => setUploadFolder(null)} onStage=${onStage} toast=${toast}/>`}

    ${moveTarget && html`<${MoveCopyModal} mode="move" target=${moveTarget} onClose=${() => setMoveTarget(null)}
      onStage=${onStage} toast=${toast}/>`}
    ${copyTarget && html`<${MoveCopyModal} mode="copy" target=${copyTarget} onClose=${() => setCopyTarget(null)}
      onStage=${onStage} toast=${toast}/>`}

    ${deleteTarget && html`<${DeleteItemModal} target=${deleteTarget} onClose=${() => setDeleteTarget(null)}
      onStage=${onStage} toast=${toast}/>`}
  </div>`;
}

/* ------------------------------ مودال‌های مسیر ------------------------------ */

function PathModal({ title, label, placeholder, note, folderPrefix, onClose, onDone }) {
  const [val, setVal] = useState('');
  const clean = val.trim().replace(/^\/+/, '');
  const ok = clean && !clean.includes('..') && clean.split('/').every((s) => s && s !== '.');
  return html`<${Modal} title=${title} onClose=${onClose} footer=${html`<${F}>
    <button class="primary" disabled=${!ok} onClick=${() => onDone(clean)}>ادامه</button>
    <button onClick=${onClose}>انصراف</button>
  </F>`}>
    <label class="field"><span class="lbl">${label}</span>
      <input type="text" dir="ltr" class="mono-ltr" value=${val} placeholder=${placeholder || 'path/to/file'} autoFocus=${true}
        onChange=${(e) => setVal(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Enter' && ok) onDone(clean); }}/>
      ${folderPrefix && html`<div class="hint">داخل: <b class="mono-ltr">${folderPrefix || 'ریشه'}</b></div>`}
      ${note && html`<div class="hint">${note}</div>`}
    </label>
  </${Modal}>`;
}

function NewFolderModal({ folderPrefix, onClose, onStage, toast }) {
  const go = async (p) => {
    try {
      await onStage({ op: 'create', kind: 'folder', path: p });
      onClose();
    } catch { /* توست در onStage نشان داده شد */ }
  };
  return html`<${PathModal} title="پوشه جدید" label="نام پوشه جدید" placeholder="src/components" folderPrefix=${folderPrefix}
    note=${'گیت پوشه‌ی خالی ندارد؛ هنگام ثبت نهایی یک فایل .gitkeep داخل آن ساخته می‌شود.'}
    onClose=${onClose} onDone=${go}/>`;
}

function UploadModal({ onClose, onStage, toast }) {
  const [files, setFiles] = useState([]);
  const [busy, setBusy] = useState(false);
  const [prefix, setPrefix] = useState('');
  const go = async () => {
    setBusy(true);
    try {
      for (const f of files) {
        if (f.size > 20 * 1024 * 1024) { toast(`${f.name} بزرگ‌تر از ۲۰ مگابایت است.`, 'err'); continue; }
        const b64 = await new Promise((res, rej) => {
          const rd = new FileReader();
          rd.onload = () => res(bufToB64(rd.result));
          rd.onerror = rej;
          rd.readAsArrayBuffer(f);
        });
        const u8 = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
        const path = (prefix ? prefix.replace(/\/+$/, '') + '/' : '') + f.name;
        await onStage({ op: 'create', kind: 'file', path, content: b64, is_binary: looksBinary(u8) });
      }
      onClose();
    } finally { setBusy(false); }
  };
  return html`<${Modal} title="بارگذاری فایل از سیستم" onClose=${onClose} footer=${html`<${F}>
    <button class="primary" disabled=${busy || files.length === 0} onClick=${go}>${busy ? html`<span class="spinner"></span>` : html`<${I.upload}/>`} افزودن ${files.length} فایل به صف</button>
    <button onClick=${onClose}>انصراف</button>
  </F>`}>
    <label class="field"><span class="lbl">پوشه‌ی مقصد (اختیاری)</span>
      <input type="text" dir="ltr" class="mono-ltr" value=${prefix} onChange=${(e) => setPrefix(e.target.value)} placeholder="assets/"/>
    </label>
    <label class="field"><span class="lbl">انتخاب فایل‌ها</span>
      <input type="file" multiple onChange=${(e) => setFiles([...e.target.files])}/>
      <div class="hint">حداکثر ۲۰ مگابایت برای هر فایل.</div>
    </label>
    ${files.length > 0 && html`<div class="hint">${files.map((f) => `${f.name} (${fmtSize(f.size)})`).join(' · ')}</div>`}
  </${Modal}>`;
}

function MoveCopyModal({ mode, target, onClose, onStage, toast }) {
  const isFolder = target.kind === 'folder';
  return html`<${PathModal}
    title=${(mode === 'move' ? 'انتقال ' : 'کپی ') + (isFolder ? 'پوشه' : 'فایل')}
    label=${'مسیر ' + (mode === 'move' ? 'مقصد' : ' جدید')}
    placeholder=${target.path}
    folderPrefix=${''}
    note=${mode === 'move'
      ? 'آیتم به مسیر جدید منتقل می‌شود (معادل rename).'
      : 'یک نسخه‌ی تازه از آیتم در مسیر جدید ساخته می‌شود.'}
    onClose=${onClose}
    onDone=${async (dst) => {
      try {
        await onStage({ op: mode, kind: target.kind, path: target.path, dst });
        onClose();
      } catch { /* توست نشان داده شد */ }
    }}/>`;
}

function DeleteItemModal({ target, onClose, onStage, toast }) {
  const isFolder = target.kind === 'folder';
  return html`<${Modal} title=${'حذف ' + (isFolder ? 'پوشه' : 'فایل')} onClose=${onClose} footer=${html`<${F}>
    <button class="danger" onClick=${async () => {
      try {
        await onStage({ op: 'delete', kind: target.kind, path: target.path });
        onClose();
      } catch { /* توست نشان داده شد */ }
    }}><${I.trash}/> حذف از صف نهایی</button>
    <button onClick=${onClose}>انصراف</button>
  </F>`}>
    <p style=${{ marginTop: 0, lineHeight: 2 }}>
      <b class="mono-ltr">${target.path}</b> ${isFolder ? 'و همه‌ی محتویاتش ' : ''}حذف می‌شود.
      حذف فقط در صف محلی ثبت می‌شود و پس از «ثبت نهایی» روی گیت‌هاب اعمال خواهد شد.
    </p>
  </${Modal}>`;
}

/* ------------------------------ تنظیمات هویت کامیت ------------------------------ */

function SettingsModal({ onClose, toast }) {
  const [s, setS] = useState(null);
  const [busy, setBusy] = useState(false);
  useEffect(() => { api('/api/settings').then(setS).catch((e) => toast(e.message, 'err')); }, [toast]);
  const save = async () => {
    setBusy(true);
    try {
      await api('/api/settings', { method: 'POST', body: s });
      toast('تنظیمات ذخیره شد.', 'ok');
      onClose();
    } catch (err) { toast(err.message, 'err'); }

  if (!s) return html`<${Modal} title="تنظیمات" onClose=${onClose}><div class="loading-page" style=${{ padding: 20 }}><span class="spinner"></span></div></${Modal}>`;
  return html`<${Modal} title="تنظیمات هویت کامیت" onClose=${onClose} footer=${html`<${F}>
    <button class="primary" disabled=${busy} onClick=${save}>${busy ? html`<span class="spinner"></span>` : ''} ذخیره</button>
    <button onClick=${onClose}>انصراف</button>
  </F>`}>
    <div class="hint" style=${{ marginBottom: 14 }}>
      هنگام «ثبت نهایی»، کامیت با این هویت ساخته می‌شود و حساب شما به‌صورت Co-authored-by به پیام کامیت اضافه می‌گردد تا هر دو به‌عنوان مشارکت‌کننده ثبت شوید.
    </div>
    <label class="field"><span class="lbl">نام نویسنده‌ی کامیت (هویت برنامه)</span>
      <input type="text" value=${s.author_name} onChange=${(e) => setS({ ...s, author_name: e.target.value })}/>
    </label>
    <label class="field"><span class="lbl">ایمیل نویسنده</span>
      <input type="text" dir="ltr" class="mono-ltr" value=${s.author_email} onChange=${(e) => setS({ ...s, author_email: e.target.value })}/>
    </label>
    <label class="chk"><input type="checkbox" checked=${s.coauthor} onChange=${(e) => setS({ ...s, coauthor: e.target.checked })}/>
      افزودن حساب من به‌عنوان مشارکت‌کننده (Co-authored-by)</label>
  </${Modal}>`;
}

function TopBar({ user, onLogout, onSettings, onHome, inRepo }) {
  return html`<div class="topbar">
    <div class="brand" style=${{ cursor: 'pointer' }} onClick=${onHome}>
      <${I.gh} size=${22}/>
      مدیریت‌کننده گیت‌هاب
    </div>
    <span class="spacer"></span>
    ${user && html`<${F}>
      ${inRepo && html`<button class="ghost small" onClick=${onHome}>فهرست مخازن</button>`}
      <button class="ghost small" onClick=${onSettings}><${I.gear}/> تنظیمات</button>
      <div class="userchip">
        <img src=${user.avatar_url} alt=""/>
        <div>
          <div class="uname">${user.name || user.login}</div>
          <div class="login">${user.login}</div>
        </div>
      </div>
      <button class="ghost small" onClick=${onLogout} title="خروج"><${I.logout}/> خروج</button>
    </${F}>`}
  </div>`;
}

function App() {
  const [user, setUser] = useState(undefined);
  const [repo, setRepo] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const { toasts, toast, dismiss } = useToasts();

  useEffect(() => {
    api('/api/auth/session').then((d) => setUser(d.user)).catch(() => setUser(null));
  }, []);

  async function logout() {
    try { await api('/api/auth/logout', { method: 'POST' }); } catch {}
    setUser(null); setRepo(null);
  }

  if (user === undefined) return html`<${F}><${TopBar}/><div class="loading-page"><span class="spinner"></span> در حال بارگذاری…</div></${F}>`;
  if (!user) return html`<${F}><${TopBar}/><${Login} onLogin=${setUser} toast=${toast}/><${Toasts} toasts=${toasts} dismiss=${dismiss}/></${F}>`;

  return html`<${F}>
    <${TopBar} user=${user} onLogout=${logout} onSettings=${() => setShowSettings(true)} onHome=${() => setRepo(null)} inRepo=${!!repo}/>
    ${repo
      ? html`<${RepoBrowser} repo=${repo} onBack=${() => setRepo(null)} toast=${toast}/>`
      : html`<${ReposView} user=${user} openRepo=${setRepo} toast=${toast}/>`}
    ${showSettings && html`<${SettingsModal} onClose=${() => setShowSettings(false)} toast=${toast}/>`}
    <${Toasts} toasts=${toasts} dismiss=${dismiss}/>
  </${F}>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
